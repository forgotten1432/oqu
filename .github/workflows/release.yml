# Builds the signed APKs on GitHub and publishes the release with release.sh.
# Run it from the Actions tab ("Release" → "Run workflow"); the version comes
# from android/app/build.gradle.kts and the notes from RELEASE_NOTES.md.
#
# One-time setup (Settings → Secrets and variables → Actions → New repository secret):
#   OQU_KEYSTORE_BASE64  base64 of the release keystore file (base64 -w0 oqu.jks)
#   OQU_STORE_PASSWORD   keystore password
#   OQU_KEY_ALIAS        key alias
#   OQU_KEY_PASSWORD     key password
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft (publish it on GitHub afterwards)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android NDK
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK $NDK"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.OQU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OQU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OQU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OQU_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release key secrets are missing (see the top of .github/workflows/release.yml)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/key"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key/oqu.jks"
          {
            echo "storeFile=$RUNNER_TEMP/key/oqu.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > "$RUNNER_TEMP/key/oqu-keystore.properties"
          echo "OQU_KEYSTORE_PROPS=$RUNNER_TEMP/key/oqu-keystore.properties" >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.draft }}" = "true" ]; then ./release.sh --draft; else ./release.sh; fi

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/key"
